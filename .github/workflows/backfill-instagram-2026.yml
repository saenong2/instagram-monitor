name: Instagram 2026 Historical Backfill

on:
  schedule:
    # 한국시간 매일 오후 8시 40분 (11:40 UTC); 일일 오전 7시 수집과 분리
    - cron: '40 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 일일 작업과 동시에 dashboard.json 및 data/ 파일을 수정하지 않도록 합니다.
concurrency:
  group: instagram-daily-update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect limited historical pages
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: python backfill_2026.py
      - name: Validate archives
        run: python check_dashboard.py
      - name: Save progress and posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.json data/posts-*.json data/backfill_2026_state.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Backfill 2026 Instagram history (limited batch)"
            git push
          fi
