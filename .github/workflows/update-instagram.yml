
name: Instagram Daily Update

on:
  schedule:
    # 매일 한국시간 오전 7시 (UTC 전날 22시)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Instagram data
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: python collect_instagram.py

      - name: Update dashboard data
        run: python publish_dashboard.py

      - name: Save updated data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.json data/
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update Instagram dashboard data"
            git push
          fi
