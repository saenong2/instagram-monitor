
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정부부처 인스타그램 모니터링</title>
  <style>
    body {
      margin: 0;
      padding: 60px 20px;
      background: #f5f6fa;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #222;
    }
    .box {
      max-width: 700px;
      margin: auto;
      padding: 50px 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    h1 { font-size: 28px; }
    p { color: #666; }
  </style>
</head>
<body>
  <div class="box">
    <h1>📊 정부부처 인스타그램 모니터링</h1>
    <p>43개 중앙행정기관의 인스타그램 활동을 한눈에 확인합니다.</p>
    <p>대시보드 준비 중입니다.</p>
  </div>
</body>
</html>
